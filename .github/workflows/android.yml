name: Android CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: Debug build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify the app
        run: ./gradlew --no-daemon :app:assembleDebug :domain:test :data:test :app:lintDebug
